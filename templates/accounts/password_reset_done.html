{% extends "base.html" %}
{% block title %}Reset Email Sent{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><div class="logo-badge"><i class="fa-solid fa-envelope-open-text"></i></div></div>
    <div class="auth-title">Check your inbox</div>
    <div class="auth-sub">If an account matches that email address, we sent password reset instructions.</div>
    <div class="auth-switch"><a href="{% url 'accounts:login' %}">Back to login</a></div>
  </div>
</div>
{% endblock %}
