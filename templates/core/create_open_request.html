{% extends "base.html" %}
{% block title %}Create Open Request{% endblock %}
{% block content %}
<h1 class="page-title">Post an Open Match Request</h1>
<p class="page-sub">Let other teams find you and respond with a challenge.</p>
<div class="card form-card">
  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group"><label>Date</label>{{ form.proposed_date }}</div>
      <div class="form-group"><label>Time</label>{{ form.proposed_time }}</div>
    </div>
    <div class="form-group"><label>Venue</label>{{ form.venue }}</div>
    <div class="form-group"><label>Details</label>{{ form.message }}</div>
    <button type="submit" class="btn btn-primary btn-block">Post Request</button>
  </form>
</div>
{% endblock %}
