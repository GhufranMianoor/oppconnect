{% extends "base.html" %}
{% block title %}Send Match Request{% endblock %}
{% block content %}
<h1 class="page-title">Challenge {{ to_team.name }}</h1>
<p class="page-sub">Propose a date, time and venue for your match.</p>
<div class="card form-card">
  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group"><label>Date</label>{{ form.proposed_date }}</div>
      <div class="form-group"><label>Time</label>{{ form.proposed_time }}</div>
    </div>
    <div class="form-group"><label>Venue</label>{{ form.venue }}</div>
    <div class="form-group"><label>Message</label>{{ form.message }}</div>
    <button type="submit" class="btn btn-primary btn-block">Send Request</button>
  </form>
</div>
{% endblock %}
